name: Test Docs

on:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - "scripts/ci/pr28-contracts.test.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/test-docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - "scripts/ci/pr28-contracts.test.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/test-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        # Docs are static and do not need dependency lifecycle scripts in CI.
        # Keeping scripts disabled also prevents install-time code execution.
        run: pnpm install --filter docs... --frozen-lockfile --ignore-scripts
      - name: Run PR28 contract tests
        run: node --test scripts/ci/pr28-contracts.test.mjs
      - name: Check docs types
        run: pnpm --filter docs run check-types
      - name: Build docs
        run: pnpm --filter docs run build
      - name: Verify internal docs links
        working-directory: apps/docs
        run: |
          if grep -RInE '\]\(/' src/content/docs; then
            echo 'Found a root-relative docs link that omits the /mausVoice/ base.' >&2
            exit 1
          fi
      - name: Verify project-site URLs and assets
        working-directory: apps/docs
        run: |
          test -f ../../docs/assets/mausvoice-banner.png
          grep -Fq 'https://maus-inc.github.io/mausVoice/getting-started/introduction/' \
            dist/getting-started/introduction/index.html
          grep -Fq 'https://maus-inc.github.io/mausVoice/sitemap-0.xml' \
            dist/sitemap-index.xml
          grep -Fq 'https://maus-inc.github.io/mausVoice/docs/assets/mausvoice-banner.png' \
            ../../index.html
          grep -Fq 'docs/assets/mausvoice-banner.png' \
            astro.config.mjs
      - name: Assemble Pages artifact (landing page + docs)
        # Option B: keep index.html at the site root and publish the built
        # docs underneath /mausVoice/ (matches the existing base). The legacy
        # Pages source must be switched to "GitHub Actions" for this to publish.
        run: |
          mkdir -p publish/mausVoice
          cp index.html publish/index.html
          cp -r apps/docs/dist/* publish/mausVoice/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

  deploy:
    name: Deploy Docs
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
