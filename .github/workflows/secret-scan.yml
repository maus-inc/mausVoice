          # The SAME expression the trusted checkout uses at the top of this job.
          # It used to fall back to `github.sha`, which on a push event is the
          # pushed commit -- so the one event where an operator is told to go look
          # at the base was the one event naming a commit whose policy was never read.
          POLICY_REF="${{ github.event.pull_request.base.sha || 'main' }}"
          # Trusted-policy resolution: absent or unreadable fails closed, and an
          # inert one fails too. The rationale and the measurement behind both are
          # in the job-level note "TRUSTED POLICY RESOLUTION" above, kept in one
          # place because three copies of a measured claim drift apart silently and
          # then read as three independent assertions. This block is byte-identical
          # in all three scans so they cannot disagree about which policy they got.
          if [ ! -r "$TRUSTED_POLICY" ]; then
            echo "::error::Trusted gitleaks policy $TRUSTED_POLICY is missing or unreadable at $POLICY_REF."
            echo "::error::Refusing to scan with the pull request's own copy."
            exit 1
          fi
