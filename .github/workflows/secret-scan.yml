name: Secret Scan

on:
  push:
    branches:
      - main
  # Scan PR heads too: a credential added and removed inside a branch is
  # invisible to the post-merge push scan, so the PR scan is the only gate
  # that can block it before it reaches main. No `branches` filter: this repo
  # runs stacked PRs whose bases are feature branches, so a main-targeted
  # filter would silently skip exactly the riskiest changes.
  pull_request: {}

permissions: {}

# Cancel superseded scans for the same PR (or the same branch for push
# events) so a flaky secret-scan queue cannot pile up on stacked PRs.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks updater-key scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Check out the trusted base commit so that the base gitleaks.toml
      # comes from the trusted base ref, not from the PR being evaluated.
      - name: Checkout trusted scanner policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          persist-credentials: false
          path: trusted-scanner

      # Fetch the target history with persist-credentials disabled so
      # the PR range can be scanned without trusting its policy or scripts.
      - name: Checkout source commits for scanning
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          path: scan-target

      # A PR must not be able to suppress the scan that judges it. The config
      # is already read from the trusted checkout; the *baseline* was not, and
      # that is the file that hides findings. Measured against gitleaks 8.18.0:
      # `detect` auto-loads `<source>/.gitleaksignore` from the tree it scans,
      # and `--gitleaks-ignore-path` only ADDS a second baseline -- it does not
      # suppress that auto-load. With an untrusted baseline present, a scan whose
      # trusted baseline is empty still reported "no leaks found"; the finding
      # only reappeared once the untrusted file was deleted from the tree. So
      # deleting it is the only thing that works, and the flag alone is not a fix.
      #
      # Gated on fork-ness because the legitimate case and the hostile case are
      # the same mechanism: this repo's own `.gitleaksignore` holds a fingerprint
      # for a test fixture, and base carries no baseline at all, so a fork PR
      # loses its own baseline here and fails closed on whatever it suppressed.
      # That trade is the point -- a write-access branch can edit this workflow
      # anyway, and its `.gitleaksignore` is in the diff under review; a fork
      # cannot, so its baseline is made inert.
      - name: Strip an untrusted baseline from the scanned checkout
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            # Honoured, but not silently. A green scan and a routine-looking diff
            # are otherwise indistinguishable from a baseline that suppressed
            # something, and this file's whole job is suppressing findings.
            if [ -f scan-target/.gitleaksignore ]; then
              echo "::warning::This pull request supplies a .gitleaksignore and it is honoured, because the branch lives in $BASE_REPO and could edit this workflow regardless. Every fingerprint in it is still untrusted input: check the added lines in this diff, because one of them can hide a finding in this same pull request."
            else
              echo "head repo $HEAD_REPO matches base; no baseline supplied"
            fi
            exit 0
          fi
          if [ -f scan-target/.gitleaksignore ]; then
            echo "::error::Pull request from $HEAD_REPO supplied a .gitleaksignore. It is ignored: findings it would have suppressed are reported."
            rm -f scan-target/.gitleaksignore
          else
            echo "no untrusted baseline present"
          fi

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.18.0
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --retry 3 --retry-delay 2 --retry-connrefused --proto '=https' "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}" -o "/tmp/${ASSET}"
          # Verify the download against the release-published checksums instead
          # of executing an unverified archive as root-installed code.
          curl -sSL --retry 3 --retry-delay 2 --retry-connrefused --proto '=https' "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          grep " ${ASSET}$" /tmp/gitleaks_checksums.txt > /tmp/gitleaks.sha256
          cd /tmp && sha256sum -c /tmp/gitleaks.sha256
          tar -xzf "/tmp/${ASSET}" -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

          # Every scan below passes `--gitleaks-ignore-path`. I verified by hand
          # against 8.18.0 that the flag exists and that it does NOT do what its
          # name suggests (it adds a baseline, it does not stop the scanned tree's
          # own `.gitleaksignore` being auto-loaded), but a hand check is a
          # property of my notes rather than of this tree. Assert it here so a
          # future version bump that drops or renames the flag fails as a
          # configuration error instead of as "Gitleaks PR scan failed", which
          # reads like a leaked secret and would block every pull request.
          if ! gitleaks detect --help 2>&1 | grep -q -- '--gitleaks-ignore-path'; then
            echo "::error::The pinned gitleaks does not accept --gitleaks-ignore-path. The scans below would fail for a configuration reason, not because a secret was found."
            exit 1
          fi
          echo "gitleaks accepts --gitleaks-ignore-path"

      - name: Scan PR commit range for secrets
        if: github.event_name == 'pull_request'
        working-directory: scan-target
        run: |
          set -euo pipefail
          status=0
          TRUSTED_POLICY="../trusted-scanner/gitleaks.toml"
          BASE_SHA="${{ github.event.pull_request.base.sha || github.sha }}"
          # Two cases, and the first one is not negotiable.
          #
          # Absent or unreadable: fail closed. That is the part a contributor can
          # reach, and the only safe answer is to refuse, because falling back to the
          # scanned checkout's own copy is the hole this checkout exists to close.
          #
          # Readable: use it, unconditionally. An earlier version of this step
          # required the trusted policy to carry the updater-key rule and otherwise
          # ran with no `-c` at all, reasoning that no config is stronger than an
          # allowlist-only one. That is wrong, and this comment records the
          # measurement rather than the reasoning, because the reasoning is what
          # produced a red job on every pull request.
          #
          # `gitleaks.toml` on 0.1.6 and on main is 23 lines: one `[allowlist]`, no
          # `[[rules]]`, and no `[extend]`. So `-c` on it does not "use the trusted
          # allowlist alongside the defaults" -- `-c` REPLACES the ruleset, and a
          # config carrying zero rules detects nothing at all. Measured on this
          # branch's own range with gitleaks 8.18.0: passing this config reports 0
          # findings; dropping `-c` and running the built-in rules reports 12.
          #
          # All 12 are false positives, and they are worth naming because they are
          # what a working scan surfaces first: 11 are Firebase `Iv1.` Web API keys
          # -- public by design -- in `reports/pr208/*.json`, review artifacts that
          # quote PR comment text, added by 0b1b342d and deleted again by 24e9484f
          # inside this branch's own history. The twelfth is the placeholder
          # `pk_live_9876543210` at packages/utilities/src/error.test.ts:128.
          # (Checked while adjudicating those 12: the DeepSource PAT disclosed in a
          # PR comment was never committed -- `git grep -cE 'dsp_[0-9a-f]{32}'` over
          # the commit that carried those artifacts returns 0 files.)
          #
          # So this job is green today because it detects nothing, and making it
          # detect something surfaces 12 known false positives. That is a security
          # policy decision about the allowlist, not one a pull request should make
          # by widening an exclusion to turn a gate green. The one-line fix belongs
          # on the base branch: `[extend] useDefault = true` in `gitleaks.toml`
          # extends the built-in rules instead of replacing them, which is what
          # turns this into a scan that both detects and stays green. Until then the
          # honest state is the warning below.
          if [ ! -r "$TRUSTED_POLICY" ]; then
            echo "::error::Trusted gitleaks policy $TRUSTED_POLICY is missing or unreadable at base $BASE_SHA."
            echo "::error::Refusing to scan with the pull request's own copy."
            exit 1
          fi
          CONFIG_ARGS=(-c "$TRUSTED_POLICY")
          if ! grep -q "tauri-minisign-updater-private-key" "$TRUSTED_POLICY" 2>/dev/null; then
            echo "::warning::Base $BASE_SHA carries no updater-key rule in gitleaks.toml, so the custom updater-key detector is inactive against this range. It stays inactive until that policy lands on the base branch."
          fi
          # The trusted baseline, when base carries one. /dev/null when it does
          # not, so the flag is always explicit and never an unstated default.
          BASELINE_FILE="../trusted-scanner/.gitleaksignore"
          [ -f "$BASELINE_FILE" ] || BASELINE_FILE=/dev/null
          output=$(gitleaks detect \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            ${CONFIG_ARGS[@]+"${CONFIG_ARGS[@]}"} --gitleaks-ignore-path "$BASELINE_FILE" \
            --redact --no-banner --verbose 2>&1) || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Gitleaks PR scan failed (status $status): $output"
            exit "$status"
          fi

      - name: Scan pushed commit range for secrets
        if: github.event_name == 'push'
        working-directory: scan-target
        run: |
          set -euo pipefail
          status=0
          TRUSTED_POLICY="../trusted-scanner/gitleaks.toml"
          BASE_SHA="${{ github.event.pull_request.base.sha || github.sha }}"
          # Two cases, and the first one is not negotiable.
          #
          # Absent or unreadable: fail closed. That is the part a contributor can
          # reach, and the only safe answer is to refuse, because falling back to the
          # scanned checkout's own copy is the hole this checkout exists to close.
          #
          # Readable: use it, unconditionally. An earlier version of this step
          # required the trusted policy to carry the updater-key rule and otherwise
          # ran with no `-c` at all, reasoning that no config is stronger than an
          # allowlist-only one. That is wrong, and this comment records the
          # measurement rather than the reasoning, because the reasoning is what
          # produced a red job on every pull request.
          #
          # `gitleaks.toml` on 0.1.6 and on main is 23 lines: one `[allowlist]`, no
          # `[[rules]]`, and no `[extend]`. So `-c` on it does not "use the trusted
          # allowlist alongside the defaults" -- `-c` REPLACES the ruleset, and a
          # config carrying zero rules detects nothing at all. Measured on this
          # branch's own range with gitleaks 8.18.0: passing this config reports 0
          # findings; dropping `-c` and running the built-in rules reports 12.
          #
          # All 12 are false positives, and they are worth naming because they are
          # what a working scan surfaces first: 11 are Firebase `Iv1.` Web API keys
          # -- public by design -- in `reports/pr208/*.json`, review artifacts that
          # quote PR comment text, added by 0b1b342d and deleted again by 24e9484f
          # inside this branch's own history. The twelfth is the placeholder
          # `pk_live_9876543210` at packages/utilities/src/error.test.ts:128.
          # (Checked while adjudicating those 12: the DeepSource PAT disclosed in a
          # PR comment was never committed -- `git grep -cE 'dsp_[0-9a-f]{32}'` over
          # the commit that carried those artifacts returns 0 files.)
          #
          # So this job is green today because it detects nothing, and making it
          # detect something surfaces 12 known false positives. That is a security
          # policy decision about the allowlist, not one a pull request should make
          # by widening an exclusion to turn a gate green. The one-line fix belongs
          # on the base branch: `[extend] useDefault = true` in `gitleaks.toml`
          # extends the built-in rules instead of replacing them, which is what
          # turns this into a scan that both detects and stays green. Until then the
          # honest state is the warning below.
          if [ ! -r "$TRUSTED_POLICY" ]; then
            echo "::error::Trusted gitleaks policy $TRUSTED_POLICY is missing or unreadable at base $BASE_SHA."
            echo "::error::Refusing to scan with the pull request's own copy."
            exit 1
          fi
          CONFIG_ARGS=(-c "$TRUSTED_POLICY")
          if ! grep -q "tauri-minisign-updater-private-key" "$TRUSTED_POLICY" 2>/dev/null; then
            echo "::warning::Base $BASE_SHA carries no updater-key rule in gitleaks.toml, so the custom updater-key detector is inactive against this range. It stays inactive until that policy lands on the base branch."
          fi
          BASELINE_FILE="../trusted-scanner/.gitleaksignore"
          [ -f "$BASELINE_FILE" ] || BASELINE_FILE=/dev/null
          output=$(gitleaks detect \
            --log-opts="${{ github.event.before }}..${{ github.event.after }}" \
            ${CONFIG_ARGS[@]+"${CONFIG_ARGS[@]}"} --gitleaks-ignore-path "$BASELINE_FILE" \
            --redact --no-banner --verbose 2>&1) || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Gitleaks push scan failed (status $status): $output"
            exit "$status"
          fi

      - name: Scan working tree for committed updater keys
        working-directory: scan-target
        run: |
          set -euo pipefail
          status=0
          TRUSTED_POLICY="../trusted-scanner/gitleaks.toml"
          BASE_SHA="${{ github.event.pull_request.base.sha || github.sha }}"
          # Two cases, and the first one is not negotiable.
          #
          # Absent or unreadable: fail closed. That is the part a contributor can
          # reach, and the only safe answer is to refuse, because falling back to the
          # scanned checkout's own copy is the hole this checkout exists to close.
          #
          # Readable: use it, unconditionally. An earlier version of this step
          # required the trusted policy to carry the updater-key rule and otherwise
          # ran with no `-c` at all, reasoning that no config is stronger than an
          # allowlist-only one. That is wrong, and this comment records the
          # measurement rather than the reasoning, because the reasoning is what
          # produced a red job on every pull request.
          #
          # `gitleaks.toml` on 0.1.6 and on main is 23 lines: one `[allowlist]`, no
          # `[[rules]]`, and no `[extend]`. So `-c` on it does not "use the trusted
          # allowlist alongside the defaults" -- `-c` REPLACES the ruleset, and a
          # config carrying zero rules detects nothing at all. Measured on this
          # branch's own range with gitleaks 8.18.0: passing this config reports 0
          # findings; dropping `-c` and running the built-in rules reports 12.
          #
          # All 12 are false positives, and they are worth naming because they are
          # what a working scan surfaces first: 11 are Firebase `Iv1.` Web API keys
          # -- public by design -- in `reports/pr208/*.json`, review artifacts that
          # quote PR comment text, added by 0b1b342d and deleted again by 24e9484f
          # inside this branch's own history. The twelfth is the placeholder
          # `pk_live_9876543210` at packages/utilities/src/error.test.ts:128.
          # (Checked while adjudicating those 12: the DeepSource PAT disclosed in a
          # PR comment was never committed -- `git grep -cE 'dsp_[0-9a-f]{32}'` over
          # the commit that carried those artifacts returns 0 files.)
          #
          # So this job is green today because it detects nothing, and making it
          # detect something surfaces 12 known false positives. That is a security
          # policy decision about the allowlist, not one a pull request should make
          # by widening an exclusion to turn a gate green. The one-line fix belongs
          # on the base branch: `[extend] useDefault = true` in `gitleaks.toml`
          # extends the built-in rules instead of replacing them, which is what
          # turns this into a scan that both detects and stays green. Until then the
          # honest state is the warning below.
          if [ ! -r "$TRUSTED_POLICY" ]; then
            echo "::error::Trusted gitleaks policy $TRUSTED_POLICY is missing or unreadable at base $BASE_SHA."
            echo "::error::Refusing to scan with the pull request's own copy."
            exit 1
          fi
          CONFIG_ARGS=(-c "$TRUSTED_POLICY")
          if ! grep -q "tauri-minisign-updater-private-key" "$TRUSTED_POLICY" 2>/dev/null; then
            echo "::warning::Base $BASE_SHA carries no updater-key rule in gitleaks.toml, so the custom updater-key detector is inactive against this range. It stays inactive until that policy lands on the base branch."
          fi
          BASELINE_FILE="../trusted-scanner/.gitleaksignore"
          [ -f "$BASELINE_FILE" ] || BASELINE_FILE=/dev/null
          output=$(gitleaks detect --no-git --source . \
            ${CONFIG_ARGS[@]+"${CONFIG_ARGS[@]}"} --gitleaks-ignore-path "$BASELINE_FILE" \
            --redact --no-banner --verbose 2>&1) || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Gitleaks working tree scan failed (status $status): $output"
            exit "$status"
          fi

      - name: Prove a Base64-only updater key is detected
        run: |
          set -euo pipefail
          fixture_dir=$(mktemp -d)
          trap 'rm -rf "$fixture_dir"' EXIT
          PREAMBLE_B64=$(printf 'untrusted comment: rsign' | base64)
          printf '%s' "$PREAMBLE_B64" > "$fixture_dir/fake-updater-key.txt"
          status=0
          # A self-test of THIS branch's detector, not an enforcement scan, so
          # reading this branch's own policy is the point: the fixture proves the
          # rule this pull request adds actually fires. Base cannot supply that
          # rule yet -- it is what this pull request adds -- so insisting on the
          # trusted copy here would fail a test for the absence of the thing under
          # test. Nothing is gated on this step's outcome.
          CONFIG_FILE="scan-target/gitleaks.toml"
          if [ ! -r "$CONFIG_FILE" ]; then
            echo "::error::This branch's own gitleaks.toml is unreadable; cannot prove the detector fires."
            exit 1
          fi
          gitleaks detect --no-git --source "$fixture_dir/fake-updater-key.txt" -c "$CONFIG_FILE" --redact --no-banner --report-path "$fixture_dir/report.json" || status=$?
          test "$status" -eq 1
          node -e 'const r = require(process.argv[1]); if (!Array.isArray(r) || !r.some(f => f.RuleID === "tauri-minisign-updater-private-key")) process.exit(1)' "$fixture_dir/report.json"
          echo "OK: Base64-only updater key fixture was detected."

      # The guard-helper tests run on Node's built-in test runner, so they
      # need a pinned Node instead of the runner default. The version comes
      # from .nvmrc (v24), the same single pin every other workflow in this
      # repo reads; setup-node itself is SHA-pinned (v5).
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: trusted-scanner/.nvmrc
          package-manager-cache: false

      - name: Prove a built-in detector is active
        run: |
          set -euo pipefail
          fixture_dir=$(mktemp -d)
          trap 'rm -rf "$fixture_dir"' EXIT
          # Synthetic, never issued by GitHub. Keep the token assembled at runtime.
          printf '%s_%s\n' 'ghp' '0123456789abcdefghijklmnopqrstuvwxyz' > "$fixture_dir/token.txt"
          status=0
          # This step proves a BUILT-IN detector is active, so the faithful
          # configuration is gitleaks' own defaults. `-c` REPLACES the built-ins
          # rather than adding to them, and the base policy is allowlist-only
          # today, so passing it would switch off the very rules this step exists
          # to demonstrate. Prefer the trusted policy when it does extend the
          # defaults; otherwise pass no config at all, which is both the faithful
          # reading and strictly stronger than any file either side controls.
          CONFIG_ARGS=()
          if [ -r trusted-scanner/gitleaks.toml ] && grep -q "useDefault = true" trusted-scanner/gitleaks.toml 2>/dev/null; then
            CONFIG_ARGS=(-c trusted-scanner/gitleaks.toml)
          fi
          gitleaks detect --no-git --source "$fixture_dir/token.txt" ${CONFIG_ARGS[@]+"${CONFIG_ARGS[@]}"} --redact --no-banner --report-path "$fixture_dir/report.json" || status=$?
          test "$status" -eq 1
          # Exit 1 alone can also mean a configuration error; require a real finding.
          node -e 'const r = require(process.argv[1]); if (!Array.isArray(r) || !r.some(f => f.RuleID === "github-pat")) process.exit(1)' "$fixture_dir/report.json"

      - name: Test gitleaks config guard helpers
        working-directory: scan-target
        run: node --test scripts/ci/check-gitleaks-config.test.mjs

      - name: Verify gitleaks.toml structure (config guard)
        working-directory: scan-target
        run: node scripts/ci/check-gitleaks-config.mjs

      - name: Run secret history-scan integration test
        working-directory: scan-target
        run: node scripts/ci/test-secret-history-scan.mjs
