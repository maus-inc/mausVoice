name: Secret Scan

on:
  push:
    branches:
      - main
  # Scan PR heads too: a credential added and removed inside a branch is
  # invisible to the post-merge push scan, so the PR scan is the only gate
  # that can block it before it reaches main. No `branches` filter: this repo
  # runs stacked PRs whose bases are feature branches, so a main-targeted
  # filter would silently skip exactly the riskiest changes.
  pull_request: {}

# Cancel superseded scans for the same PR (or the same branch for push
# events) so a flaky secret-scan queue cannot pile up on stacked PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks updater-key scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Check out the trusted base commit so that the base gitleaks.toml
      # comes from the trusted base ref, not from the PR being evaluated.
      - name: Checkout trusted scanner policy
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          persist-credentials: false
          path: trusted-scanner

      # Fetch the target history with persist-credentials disabled so
      # the PR range can be scanned without trusting its policy or scripts.
      - name: Checkout source commits for scanning
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          path: scan-target

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.18.0
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --retry 3 --retry-delay 2 --retry-connrefused --proto '=https' "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}" -o "/tmp/${ASSET}"
          # Verify the download against the release-published checksums instead
          # of executing an unverified archive as root-installed code.
          curl -sSL --retry 3 --retry-delay 2 --retry-connrefused --proto '=https' "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          grep " ${ASSET}$" /tmp/gitleaks_checksums.txt > /tmp/gitleaks.sha256
          cd /tmp && sha256sum -c /tmp/gitleaks.sha256
          tar -xzf "/tmp/${ASSET}" -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan PR commit range for secrets
        if: github.event_name == 'pull_request'
        working-directory: scan-target
        run: |
          set -euo pipefail
          status=0
          CONFIG_FILE="../trusted-scanner/gitleaks.toml"
          if [ ! -f "$CONFIG_FILE" ] || ! grep -q "tauri-minisign-updater-private-key" "$CONFIG_FILE" 2>/dev/null; then
            CONFIG_FILE="gitleaks.toml"
          fi
          output=$(gitleaks detect \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            -c "$CONFIG_FILE" --redact --no-banner --verbose 2>&1) || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Gitleaks PR scan failed (status $status): $output"
            exit "$status"
          fi

      - name: Scan pushed commit range for secrets
        if: github.event_name == 'push'
        working-directory: scan-target
        run: |
          set -euo pipefail
          status=0
          CONFIG_FILE="../trusted-scanner/gitleaks.toml"
          if [ ! -f "$CONFIG_FILE" ] || ! grep -q "tauri-minisign-updater-private-key" "$CONFIG_FILE" 2>/dev/null; then
            CONFIG_FILE="gitleaks.toml"
          fi
          output=$(gitleaks detect \
            --log-opts="${{ github.event.before }}..${{ github.event.after }}" \
            -c "$CONFIG_FILE" --redact --no-banner --verbose 2>&1) || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Gitleaks push scan failed (status $status): $output"
            exit "$status"
          fi

      - name: Scan working tree for committed updater keys
        working-directory: scan-target
        run: |
          set -euo pipefail
          status=0
          CONFIG_FILE="../trusted-scanner/gitleaks.toml"
          if [ ! -f "$CONFIG_FILE" ] || ! grep -q "tauri-minisign-updater-private-key" "$CONFIG_FILE" 2>/dev/null; then
            CONFIG_FILE="gitleaks.toml"
          fi
          output=$(gitleaks detect --no-git --source . -c "$CONFIG_FILE" --redact --no-banner --verbose 2>&1) || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Gitleaks working tree scan failed (status $status): $output"
            exit "$status"
          fi

      - name: Prove a Base64-only updater key is detected
        run: |
          set -euo pipefail
          fixture_dir=$(mktemp -d)
          trap 'rm -rf "$fixture_dir"' EXIT
          PREAMBLE_B64=$(printf 'untrusted comment: rsign' | base64)
          printf '%s' "$PREAMBLE_B64" > "$fixture_dir/fake-updater-key.txt"
          status=0
          CONFIG_FILE="trusted-scanner/gitleaks.toml"
          if [ ! -f "$CONFIG_FILE" ] || ! grep -q "tauri-minisign-updater-private-key" "$CONFIG_FILE" 2>/dev/null; then
            CONFIG_FILE="scan-target/gitleaks.toml"
          fi
          gitleaks detect --no-git --source "$fixture_dir/fake-updater-key.txt" -c "$CONFIG_FILE" --redact --no-banner --report-path "$fixture_dir/report.json" || status=$?
          test "$status" -eq 1
          node -e 'const r = require(process.argv[1]); if (!Array.isArray(r) || !r.some(f => f.RuleID === "tauri-minisign-updater-private-key")) process.exit(1)' "$fixture_dir/report.json"
          echo "OK: Base64-only updater key fixture was detected."

      # The guard-helper tests run on Node's built-in test runner, so they
      # need a pinned Node instead of the runner default. The version comes
      # from .nvmrc (v24), the same single pin every other workflow in this
      # repo reads; setup-node itself is SHA-pinned (v5).
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: scan-target/.nvmrc
          package-manager-cache: false

      - name: Prove a built-in detector is active
        run: |
          set -euo pipefail
          fixture_dir=$(mktemp -d)
          trap 'rm -rf "$fixture_dir"' EXIT
          # Synthetic, never issued by GitHub. Keep the token assembled at runtime.
          printf '%s_%s\n' 'ghp' '0123456789abcdefghijklmnopqrstuvwxyz' > "$fixture_dir/token.txt"
          status=0
          CONFIG_FILE="trusted-scanner/gitleaks.toml"
          if [ ! -f "$CONFIG_FILE" ] || ! grep -q "useDefault = true" "$CONFIG_FILE" 2>/dev/null; then
            CONFIG_FILE="scan-target/gitleaks.toml"
          fi
          gitleaks detect --no-git --source "$fixture_dir/token.txt" -c "$CONFIG_FILE" --redact --no-banner --report-path "$fixture_dir/report.json" || status=$?
          test "$status" -eq 1
          # Exit 1 alone can also mean a configuration error; require a real finding.
          node -e 'const r = require(process.argv[1]); if (!Array.isArray(r) || !r.some(f => f.RuleID === "github-pat")) process.exit(1)' "$fixture_dir/report.json"

      - name: Test gitleaks config guard helpers
        working-directory: scan-target
        run: node --test scripts/ci/check-gitleaks-config.test.mjs

      - name: Verify gitleaks.toml structure (config guard)
        working-directory: scan-target
        run: node scripts/ci/check-gitleaks-config.mjs

      - name: Run secret history-scan integration test
        working-directory: scan-target
        run: node scripts/ci/test-secret-history-scan.mjs
