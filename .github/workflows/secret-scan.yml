            # scans all come before the six self-verification steps, which carry no
            # `if:`, so
            # failing here meant this job never ran a single one of its own
            # self-verification steps -- the updater-key fixture, the built-in
            # detector fixture, the config-guard tests and the history-scan
            # integration test all became unreachable against my own base. The
