            --log-opts="${{ github.event.before }}..${{ github.event.after }}" \
            ${CONFIG_ARGS[@]+"${CONFIG_ARGS[@]}"} --gitleaks-ignore-path "$BASELINE_FILE" \
            --redact --no-banner --verbose 2>&1) || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Gitleaks push scan failed (status $status): $output"
            exit "$status"
          fi

      - name: Scan working tree for committed updater keys
        working-directory: scan-target
        run: |
          set -euo pipefail
          status=0
          TRUSTED_POLICY="../trusted-scanner/gitleaks.toml"
          # The SAME expression the trusted checkout uses at the top of this job.
          # It used to fall back to `github.sha`, which on a push event is the
