name: Secret Scan Config

on:
  push:
    branches:
      - main
    paths:
      - "gitleaks.toml"
      - "scripts/ci/check-gitleaks-config.mjs"
      - ".github/workflows/secret-scan.yml"
  pull_request:
    branches:
      - main
    paths:
      - "gitleaks.toml"
      - "scripts/ci/check-gitleaks-config.mjs"
      - ".github/workflows/secret-scan.yml"

jobs:
  verify-gitleaks-config:
    name: Verify Gitleaks updater-key guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v5
        with:
          node-version-file: .nvmrc
      - name: Verify the updater private-key preamble is a detection rule, not an allowlist exemption
        run: node scripts/ci/check-gitleaks-config.mjs
