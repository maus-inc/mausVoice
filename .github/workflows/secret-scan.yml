          # whole hazard here. `gitleaks detect -c` REPLACES the ruleset rather
          # than adding to it, so a policy carrying neither a `[[rules]]` table nor
          # `[extend] useDefault = true` leaves the scan with an empty ruleset: it
          # finds nothing and exits 0, which a green check cannot distinguish from
          # a clean repository. That is the state of the base branch today.
          #
          # So this step skips itself on purpose rather than reporting a success it
          # did not earn; the closing step turns that into the job's verdict. The remedy is one line on the base branch, which is exactly
          # why a pull request against that base cannot supply it -- and an earlier
          # version of this step "solved" that by scanning with no `-c` at all,
          # which turned a blind green into 12 known false positives. Visible and
          # noisy beats invisible and empty; neither is good, and only the base
          # branch can finish it.
          #
          # The check reads the TRUSTED checkout. Answering it from the scanned
          # tree would let the pull request under review decide the question that
          # gates it, which is the same class of hole as trusting its .gitleaksignore.
          # Coverage is ONE property, and this check previously conflated it with a
          # different one, which is how it came to accept a shape that is blind.
          #
          # What has to be proven: that gitleaks will run with its built-in
          # detectors. That is `[extend] useDefault = true`, and nothing else
          # stands in for it.
          #
          # What must NOT be accepted: a policy carrying a `[[rules]]` table and no
          # `[extend]`. `-c` replaces the ruleset, so that shape scans the whole
          # range with whatever narrow rules the file declares and roughly 180
          # detectors switched off -- the same blind green as an empty policy, only
          # narrower, and it sailed through a check whose error message talked
          # about coverage. Custom rules join the built-ins only when useDefault is
          # set; without it they replace them.
          #
          # So there is one positive proof, and a policy that cannot be shown to
          # carry it is SKIPPED rather than assumed -- and the closing step at the
          # end of this job is what fails. Failing here instead would make every
          # self-verification step after this one unreachable, because they carry no
          # `if:` and the scans run before all of them.
          active=0
          if awk '/^[[:space:]]*\[extend\][[:space:]]*$/ { in_extend = 1; next }
                   in_extend && /^[[:space:]]*\[/ { exit }
                   in_extend && /^[[:space:]]*useDefault[[:space:]]*=[[:space:]]*true[[:space:]]*($|#)/ { found = 1 }
                   END { exit !found }' "$TRUSTED_POLICY"; then
            active=1
          fi
          if [ "$active" -ne 1 ]; then
            # Skip the scan and record why, rather than exiting here. Exiting at
            # this point was my first version and it was worse than it looked: the
            # scans all come before the six self-verification steps, which carry no
            # `if:`, so
            # failing here meant this job never ran a single one of its own
            # self-verification steps -- the updater-key fixture, the built-in
            # detector fixture, the config-guard tests and the history-scan
            # integration test all became unreachable against my own base. The
            # verdict belongs at the end of the job, where `always()` reaches it.
            #
            # Nothing is recorded here on purpose. Two earlier versions did, and
            # both were wrong in the same way: the closing step read a FILE to learn
            # whether a scan had run, and the three steps that run
            # `node scripts/ci/*.mjs` are
            # `node scripts/ci/*.mjs` executed from the SCANNED checkout as the same
            # uid as this one. One `rm` in any of them makes the gate report a scan it
            # never performed; one `printf` makes it fail against a base that is
            # perfectly capable. The pull request under review could decide the
            # verdict either way, which is the defect the trusted checkout exists to
            # prevent. So the closing step re-derives the answer from the trusted
            # checkout, which no step in this job can write.
            echo "::warning::Trusted gitleaks policy at $POLICY_REF cannot detect anything, so this scan is SKIPPED rather than reported clean. See the closing step for the failure."
            exit 0
          fi
          CONFIG_ARGS=(-c "$TRUSTED_POLICY")
          if ! grep -q "tauri-minisign-updater-private-key" "$TRUSTED_POLICY" 2>/dev/null; then
            echo "::warning::The policy at $POLICY_REF carries no updater-key rule in gitleaks.toml, so the custom updater-key detector is inactive against this range. It stays inactive until that policy lands on the base branch."
          fi
          # The trusted baseline, when base carries one. /dev/null when it does
          # not, so the flag is always explicit and never an unstated default.
          BASELINE_FILE="../trusted-scanner/.gitleaksignore"
          [ -f "$BASELINE_FILE" ] || BASELINE_FILE=/dev/null
          output=$(gitleaks detect \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            ${CONFIG_ARGS[@]+"${CONFIG_ARGS[@]}"} --gitleaks-ignore-path "$BASELINE_FILE" \
            --redact --no-banner --verbose 2>&1) || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Gitleaks PR scan failed (status $status): $output"
            exit "$status"
          fi

      - name: Scan pushed commit range for secrets
        if: github.event_name == 'push'
        working-directory: scan-target
        run: |
          set -euo pipefail
