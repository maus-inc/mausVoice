name: Secret Scan

on:
  push:
    branches:
      - main
  # Scan PR heads too: a credential added and removed inside a branch is
  # invisible to the post-merge push scan, so the PR scan is the only gate
  # that can block it before it reaches main. pull_request (not
  # pull_request_target) keeps the workflow running on the merge commit
  # without granting the target repo's secrets to forked code. No `branches`
  # filter: this repo runs stacked PRs whose bases are feature branches, so
  # a main-targeted filter would silently skip exactly the riskiest changes.
  pull_request: {}

jobs:
  gitleaks:
    name: Gitleaks updater-key scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Fetch the full history so the real PR/push commit range can be scanned
      # for secrets that were added and later removed within the branch.
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v5
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.18.0
          ASSET="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --proto '=https' "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ASSET}" -o "/tmp/${ASSET}"
          # Verify the download against the release-published checksums instead
          # of executing an unverified archive as root-installed code.
          curl -sSL --proto '=https' "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt
          grep " ${ASSET}$" /tmp/gitleaks_checksums.txt > /tmp/gitleaks.sha256
          cd /tmp && sha256sum -c /tmp/gitleaks.sha256
          tar -xzf "/tmp/${ASSET}" -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan PR commit range for secrets
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          gitleaks detect \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            -c gitleaks.toml --redact --no-banner
      - name: Scan pushed commit range for secrets
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          gitleaks detect \
            --log-opts="${{ github.event.before }}..${{ github.event.after }}" \
            -c gitleaks.toml --redact --no-banner
      - name: Scan working tree for committed updater keys
        run: gitleaks detect --no-git --source . -c gitleaks.toml
      - name: Prove a Base64-only updater key is detected
        run: |
          set -euo pipefail
          # Derive the Base64 preamble dynamically so this workflow file itself
          # never contains the literal updater-key string (which would make the
          # repo scan below self-detect and fail).
          PREAMBLE_B64=$(printf 'untrusted comment: rsign' | base64)
          printf '%s' "$PREAMBLE_B64" > /tmp/fake-updater-key.txt
          if gitleaks detect --no-git --source /tmp/fake-updater-key.txt -c gitleaks.toml; then
            echo "::error::Gitleaks failed to detect a Base64-only updater key fixture" >&2
            exit 1
          fi
          echo "OK: Base64-only updater key fixture was detected."
      # The guard-helper tests use Node's built-in test runner, so pin a
      # known Node version instead of relying on the runner default.
      # Pin Node for the node --test steps below so they never depend on
      # the runner's default Node. SHA-pinned (v5 tag, release line used by
      # every other workflow in this repo) with the tag noted for humans.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v5
        with:
          node-version-file: .nvmrc
      - name: Test gitleaks config guard helpers
        run: node --test scripts/ci/check-gitleaks-config.test.mjs
      - name: Verify gitleaks.toml structure (config guard)
        run: node scripts/ci/check-gitleaks-config.mjs
      - name: Run secret history-scan integration test
        run: node scripts/ci/test-secret-history-scan.mjs
