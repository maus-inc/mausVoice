          # `if:` and the scans run before all of them.
          active=0
          if awk '/^[[:space:]]*\[extend\][[:space:]]*$/ { in_extend = 1; next }
                   in_extend && /^[[:space:]]*\[/ { exit }
                   in_extend && /^[[:space:]]*useDefault[[:space:]]*=[[:space:]]*true[[:space:]]*($|#)/ { found = 1 }
                   END { exit !found }' "$TRUSTED_POLICY"; then
            active=1
          fi
          if [ "$active" -ne 1 ]; then
            # Skip the scan and record why, rather than exiting here. Exiting at
            # this point was my first version and it was worse than it looked: the
            # scans all come before the six self-verification steps, which carry no
            # `if:`, so
            # failing here meant this job never ran a single one of its own
            # self-verification steps -- the updater-key fixture, the built-in
            # detector fixture, the config-guard tests and the history-scan
            # integration test all became unreachable against my own base. The
            # verdict belongs at the end of the job, where `always()` reaches it.
            #
            # Nothing is recorded here on purpose. Two earlier versions did, and
            # both were wrong in the same way: the closing step read a FILE to learn
            # whether a scan had run, and the three steps that run
            # `node scripts/ci/*.mjs` are
            # `node scripts/ci/*.mjs` executed from the SCANNED checkout as the same
            # uid as this one. One `rm` in any of them makes the gate report a scan it
            # never performed; one `printf` makes it fail against a base that is
            # perfectly capable. The pull request under review could decide the
            # verdict either way, which is the defect the trusted checkout exists to
            # prevent. So the closing step re-derives the answer from the trusted
            # checkout, which no step in this job can write.
            echo "::warning::Trusted gitleaks policy at $POLICY_REF cannot detect anything, so this scan is SKIPPED rather than reported clean. See the closing step for the failure."
            exit 0
          fi
          CONFIG_ARGS=(-c "$TRUSTED_POLICY")
          if ! grep -q "tauri-minisign-updater-private-key" "$TRUSTED_POLICY" 2>/dev/null; then
            echo "::warning::The policy at $POLICY_REF carries no updater-key rule in gitleaks.toml, so the custom updater-key detector is inactive against this range. It stays inactive until that policy lands on the base branch."
          fi
          BASELINE_FILE="../trusted-scanner/.gitleaksignore"
          [ -f "$BASELINE_FILE" ] || BASELINE_FILE=/dev/null
          output=$(gitleaks detect --no-git --source . \
            ${CONFIG_ARGS[@]+"${CONFIG_ARGS[@]}"} --gitleaks-ignore-path "$BASELINE_FILE" \
            --redact --no-banner --verbose 2>&1) || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Gitleaks working tree scan failed (status $status): $output"
            exit "$status"
          fi

      - name: Prove a Base64-only updater key is detected
        run: |
          set -euo pipefail
          fixture_dir=$(mktemp -d)
          trap 'rm -rf "$fixture_dir"' EXIT
          # A key file in the shape `tauri signer generate` writes: the
          # untrusted-comment line in plain text, then base64 of the key payload.
          # An earlier version of this fixture was the base64 of the preamble text
          # alone, which the rule's previous base64-only regex matched -- so it
          # proved the rule matched the fixture and nothing about real keys.
          printf 'untrusted comment: rsign encrypted secret key\nRWQ5aGF1c2VmaWtlc2VjcmV0a2V5bWF0ZXJpYWxmb3J1cHRlci0y\n' > "$fixture_dir/fake-updater-key.txt"
          status=0
          # A self-test of THIS branch's detector, not an enforcement scan, so
          # reading this branch's own policy is the point: the fixture proves the
          # rule this pull request adds actually fires. Base cannot supply that
          # rule yet -- it is what this pull request adds -- so insisting on the
          # trusted copy here would fail a test for the absence of the thing under
          # test. Nothing is gated on this step's outcome.
          CONFIG_FILE="scan-target/gitleaks.toml"
          if [ ! -r "$CONFIG_FILE" ]; then
            echo "::error::This branch's own gitleaks.toml is unreadable; cannot prove the detector fires."
            exit 1
          fi
          gitleaks detect --no-git --source "$fixture_dir/fake-updater-key.txt" -c "$CONFIG_FILE" --redact --no-banner --report-path "$fixture_dir/report.json" || status=$?
          test "$status" -eq 1
          node -e 'const r = require(process.argv[1]); if (!Array.isArray(r) || !r.some(f => f.RuleID === "tauri-minisign-updater-private-key")) process.exit(1)' "$fixture_dir/report.json"
          # ...and the same file base64-wrapped whole, which is the case the
          # rule's second arm covers.
          base64 < "$fixture_dir/fake-updater-key.txt" > "$fixture_dir/fake-updater-key.b64"
          status=0
          gitleaks detect --no-git --source "$fixture_dir/fake-updater-key.b64" -c "$CONFIG_FILE" --redact --no-banner --report-path "$fixture_dir/report.json" || status=$?
          test "$status" -eq 1
          node -e 'const r = require(process.argv[1]); if (!Array.isArray(r) || !r.some(f => f.RuleID === "tauri-minisign-updater-private-key")) process.exit(1)' "$fixture_dir/report.json"
          echo "OK: a real key file and a base64-wrapped one were both detected."

      # The guard-helper tests run on Node's built-in test runner, so they
      # need a pinned Node instead of the runner default. The version comes
      # from .nvmrc (v24), the same single pin every other workflow in this
      # repo reads; setup-node itself is SHA-pinned (v5).
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: trusted-scanner/.nvmrc
          package-manager-cache: false

      - name: Prove a built-in detector is active
        run: |
          set -euo pipefail
          fixture_dir=$(mktemp -d)
          trap 'rm -rf "$fixture_dir"' EXIT
          # Synthetic, never issued by GitHub. Keep the token assembled at runtime.
          printf '%s_%s\n' 'ghp' '0123456789abcdefghijklmnopqrstuvwxyz' > "$fixture_dir/token.txt"
          status=0
          # This step proves a BUILT-IN detector is active, so the faithful
          # configuration is gitleaks' own defaults. `-c` REPLACES the built-ins
          # rather than adding to them, so passing a policy that does NOT extend them
          # would switch off the very rules this step exists to demonstrate. Prefer
          # the trusted policy when it does extend the
          # defaults; otherwise pass no config at all, which is both the faithful
          # reading and strictly stronger than any file either side controls.
          CONFIG_ARGS=()
          if [ -r trusted-scanner/gitleaks.toml ] && grep -q "useDefault = true" trusted-scanner/gitleaks.toml 2>/dev/null; then
            CONFIG_ARGS=(-c trusted-scanner/gitleaks.toml)
          fi
          gitleaks detect --no-git --source "$fixture_dir/token.txt" ${CONFIG_ARGS[@]+"${CONFIG_ARGS[@]}"} --redact --no-banner --report-path "$fixture_dir/report.json" || status=$?
          test "$status" -eq 1
          # Exit 1 alone can also mean a configuration error; require a real finding.
          node -e 'const r = require(process.argv[1]); if (!Array.isArray(r) || !r.some(f => f.RuleID === "github-pat")) process.exit(1)' "$fixture_dir/report.json"

      - name: Test gitleaks config guard helpers
        working-directory: scan-target
        run: node --test scripts/ci/check-gitleaks-config.test.mjs

      - name: Verify gitleaks.toml structure (config guard)
        working-directory: scan-target
        run: node scripts/ci/check-gitleaks-config.mjs

      - name: Run secret history-scan integration test
        working-directory: scan-target
        run: node scripts/ci/test-secret-history-scan.mjs

      # The verdict, last, and `always()` so it is reached whatever happened above.
      #
      # This step exists because failing inside the scans was wrong. The three scans
      # come before every self-verification step this job has, and those steps carry
      # no `if:`, so an inert-policy failure in the last scan made the updater-key
      # fixture, the built-in detector fixture, both config-guard steps and the
      # history-scan integration test unreachable. The job reported a policy problem
      # while proving nothing about itself.
      #
      # So the scans skip themselves, everything else runs, and this step decides.
      # `if: always()` also means a real leak found in a scan is not masked by
      # anything here: that step has already failed the job.
      #
      # It decides by RE-DERIVING the capability question from the trusted checkout,
      # with the predicate below byte-identical to the one in all three scans. It does
      # not ask whether a scan ran, because that answer used to come from a file on
      # disk -- first in runner temp, then in this trusted checkout -- and the three
      # steps that run `node scripts/ci/*.mjs` do it from the SCANNED checkout, under
      # the same uid as everything else here. Both locations were removable by the code
      # being judged:
      # deleting the file turned an unscanned range green, and writing it turned a
      # scannable base red. Asking the trusted checkout a question that involves no
      # other step is the only version of this verdict that a pull request cannot
      # decide. Its `working-directory` is the scanned checkout, purely so the trusted
      # policy sits at the same relative path here as it does in the scans; nothing
      # from that directory is executed or read except this one file, from the parent.
      - name: Require a secret-scan policy that can actually detect secrets
        if: always()
        working-directory: scan-target
        run: |
          set -euo pipefail
          # THE SAME expression the trusted checkout uses at the top of this job, and
          # the same resolution the three scans do. Byte-identical on purpose: four
          # copies of a measured claim drift apart silently, and a contract test
          # compares these blocks so a drift fails CI instead of reading as four
          # independent assertions.
          POLICY_REF="${{ github.event.pull_request.base.sha || 'main' }}"
          TRUSTED_POLICY="../trusted-scanner/gitleaks.toml"
          if [ ! -r "$TRUSTED_POLICY" ]; then
            echo "::error::Trusted gitleaks policy $TRUSTED_POLICY is missing or unreadable at $POLICY_REF, so this pull request is unscanned."
            exit 1
          fi
          active=0
          if awk '/^[[:space:]]*\[extend\][[:space:]]*$/ { in_extend = 1; next }
                   in_extend && /^[[:space:]]*\[/ { exit }
                   in_extend && /^[[:space:]]*useDefault[[:space:]]*=[[:space:]]*true[[:space:]]*($|#)/ { found = 1 }
                   END { exit !found }' "$TRUSTED_POLICY"; then
            active=1
          fi
          if [ "$active" -ne 1 ]; then
            echo "::error::The trusted gitleaks policy at $POLICY_REF does not extend gitleaks' built-in detectors: it has no [extend] table with useDefault = true, so every scan in this job was SKIPPED rather than reported clean."
            echo "::error::gitleaks' -c REPLACES the ruleset rather than adding to it, so a policy carrying no [[rules]] detects nothing and exits 0. A scan that reports nothing because it cannot see is worse than one that fails, because it reads as a clean range."
            echo "::error::The fix belongs on the base branch: add an [extend] table with useDefault = true to gitleaks.toml there. A [[rules]] table is not a substitute -- custom rules supplement the built-in detectors only when useDefault is set, and replace them when it is not."
            echo "::error::Until that lands, this pull request is unscanned. Do not read a green run of this job as evidence that no credential was added; there has not been a green run."
            exit 1
          fi
          echo "The trusted gitleaks policy at $POLICY_REF extends gitleaks' built-in detectors, so every scan in this job ran against it."
