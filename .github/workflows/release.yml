name: Release mausVoice

# Robust release pipeline for mausVoice desktop.
#
# Trigger: manual dispatch ("Run workflow"). This publishes a versioned
# GitHub Release with unsigned, self-built installers for macOS (universal),
# Windows, and Linux. No code signing, no notarization, no updater channel
# metadata — the signing key is the repo-visible throwaway CI key, so the
# updater must never publish latest.json.
#
# Typical flow:
#   1. Enter the version (e.g. 0.1.3) and optional release notes
#   2. Run this workflow
#   3. Assets + a formatted release body land on the GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.3, 0.2.0-rc.1). Used for the tag and release title."
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        default: false
        type: boolean
      notes:
        description: "Optional markdown for the 'What's new' section. Leave empty to auto-generate from commits."
        required: false
        default: ""
        type: string
      tag:
        description: "Optional explicit tag (default: mausVoice-v{version})"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-mausvoice
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (universal)
            os: macos-14
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            tauri_platform: macos
            node_platform: darwin
            bundle_dir: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
            require_gpu_sidecar: true
          - label: Windows
            os: windows-latest
            args: ""
            rust_targets: ""
            tauri_platform: windows
            node_platform: win32
            bundle_dir: D:\cargo\release\bundle
            require_gpu_sidecar: false
          - label: Linux
            os: ubuntu-22.04
            args: "--bundles deb,appimage"
            rust_targets: ""
            tauri_platform: linux
            node_platform: linux
            bundle_dir: apps/desktop/src-tauri/target/release/bundle
            require_gpu_sidecar: false
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate version input
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          case "$RELEASE_VERSION" in
            ''|*[!0-9A-Za-z.\-]*|.*|..*)
              echo "Invalid version '$RELEASE_VERSION' (expected semver like 0.1.3)" >&2
              exit 1 ;;
            *) echo "Version OK: $RELEASE_VERSION" ;;
          esac

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.6"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Ensure universal macOS Rust targets
        if: matrix.os == 'macos-14'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            apps/desktop/src-tauri -> ${{ matrix.os == 'windows-latest' && 'D:\cargo' || 'target' }}
          key: ${{ matrix.os }}-release

      - name: Set Windows-only build environment
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          echo "CARGO_TARGET_DIR=D:\cargo" >> $env:GITHUB_ENV

      - name: Set sidecar build environment (macOS)
        if: matrix.os == 'macos-14'
        run: |
          echo "CMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/packages/rust_transcription/cmake/macos-ci-toolchain.cmake" >> "$GITHUB_ENV"

      - name: Set sidecar build environment (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          echo "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\packages\rust_transcription\cmake\windows-ci-toolchain.cmake" >> $env:GITHUB_ENV

      - name: Set sidecar build environment (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          echo "CMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/packages/rust_transcription/cmake/linux-ci-toolchain.cmake" >> "$GITHUB_ENV"

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          ./.github/scripts/install-desktop-linux-deps.sh

      - name: Install dependencies
        # --ignore-scripts would skip the esbuild/sharp postinstall builds this
        # monorepo needs; mirrors build/lint/test workflows.
        run: pnpm install --frozen-lockfile # NOSONAR

      - name: Sync release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.RELEASE_VERSION;
            const files = [
              'apps/desktop/package.json',
              'apps/desktop/src-tauri/tauri.conf.json',
              'apps/desktop/src-tauri/tauri.prod.conf.json'
            ];
            for (const f of files) {
              const p = JSON.parse(fs.readFileSync(f, 'utf8'));
              p.version = version;
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            }
            console.log('Version synced to ' + version);
          "

      - name: Build frontend and dependencies
        env:
          TAURI_PLATFORM: ${{ matrix.tauri_platform }}
          MAUSVOICE_DESKTOP_PLATFORM: ${{ matrix.node_platform }}
        run: pnpm exec turbo run build --filter=desktop...

      - name: Build Tauri app
        env:
          TAURI_PLATFORM: ${{ matrix.tauri_platform }}
          MAUSVOICE_DESKTOP_PLATFORM: ${{ matrix.node_platform }}
          MAUSVOICE_REQUIRE_GPU_SIDECAR: ${{ matrix.require_gpu_sidecar && 'true' || 'false' }}
          MACOSX_DEPLOYMENT_TARGET: "13.3"
          CMAKE_OSX_DEPLOYMENT_TARGET: "13.3"
          # Throwaway signing key, unsigned build only — same one build-desktop.yml uses for CI validation.
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_CI_PUBKEY: "dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDQ2NTZFNDMzMzYyMjBCMzgKUldRNEN5STJNK1JXUmpWRDMzem12QUtjVkFxWERXanl0ZVRCWi9JOTd3bmRFRVFuQkp1QmpiN0EK"
        working-directory: apps/desktop
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (c.plugins?.updater?.pubkey === '__UPDATER_PUBLIC_KEY__') {
              c.plugins.updater.pubkey = process.env.TAURI_CI_PUBKEY;
            }
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "
          pnpm run tauri build --ci ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mausvoice-${{ matrix.tauri_platform }}
          path: |
            ${{ matrix.bundle_dir }}/**/*.dmg
            ${{ matrix.bundle_dir }}/**/*.app.tar.gz
            ${{ matrix.bundle_dir }}/**/*.msi
            ${{ matrix.bundle_dir }}/**/*.nsis.zip
            ${{ matrix.bundle_dir }}/**/*.exe
            ${{ matrix.bundle_dir }}/**/*.deb
            ${{ matrix.bundle_dir }}/**/*.AppImage
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source (for auto release notes)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist

      - name: Resolve tag name
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag_name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "release_name=mausVoice $INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=mausVoice-v$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "release_name=mausVoice v$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release body
        id: body
        env:
          ARTIFACTS_DIR: dist
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.tag.outputs.release_name }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          node scripts/ci/generate-release-body.mjs > "$RUNNER_TEMP/release-body.md"
          echo "body_file=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        # 'token' input (default: github.token) overrides GITHUB_TOKEN, so pass the
        # maintainer PAT here explicitly — otherwise the release is authored by
        # github-actions[bot]. Falls back to GITHUB_TOKEN when RELEASE_TOKEN is unset.
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.release_name }}
          body_path: ${{ steps.body.outputs.body_file }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/**/*.dmg
            dist/**/*.app.tar.gz
            dist/**/*.msi
            dist/**/*.nsis.zip
            dist/**/*.exe
            dist/**/*.deb
            dist/**/*.AppImage