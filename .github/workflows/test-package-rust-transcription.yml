name: Test Package Rust Transcription

on:
  push:
    paths:
      - "scripts/ci/run-with-diagnostics.sh"
      - "scripts/ci/sherpa-onnx-link-mode.test.mjs"
      - "scripts/ci/sherpa-build-script-tests.mjs"
      - "scripts/ci/sherpa-build-script-tests.test.mjs"
      - "packages/rust_transcription/**"
      - "patches/sherpa-onnx-sys-1.13.5/**"
      - "rust-toolchain.toml"
      - ".github/workflows/test-package-rust-transcription.yml"
  # The Rust transcription package has no other automated test coverage, so a
  # pull request that touches it needs the gate too. This workflow used to fire
  # on pushes only, which meant a reviewer looking at the checks saw nothing for
  # the package and reasonably concluded it was covered elsewhere.
  pull_request:
    paths:
      - "scripts/ci/run-with-diagnostics.sh"
      - "scripts/ci/sherpa-onnx-link-mode.test.mjs"
      - "scripts/ci/sherpa-build-script-tests.mjs"
      - "scripts/ci/sherpa-build-script-tests.test.mjs"
      - "packages/rust_transcription/**"
      - "patches/sherpa-onnx-sys-1.13.5/**"
      - "rust-toolchain.toml"
      - ".github/workflows/test-package-rust-transcription.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Rust Transcription (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # Ubuntu downloads ONNX/whisper model artifacts over the network during the
    # ignored end-to-end integration tests; 20 minutes is too tight there (the
    # macOS/Windows jobs finish in ~2-4 minutes). Raised so the slowest runner
    # has headroom. A follow-up should cache the model artifacts instead of
    # re-downloading them every run.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu
            os: ubuntu-latest
          - label: Windows
            os: windows-latest
          - label: macOS
            os: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check the sherpa-onnx link mode against the Android archive
        # Node-only and it reads a file from the checkout, so it runs after
        # `Checkout source` and before the toolchain and matrix work: it still
        # fails in seconds rather than after a cargo build. This step used to
        # run first, where `scripts/ci/` did not exist yet, so the job failed on
        # every leg and the rest of the steps were skipped. The android archive
        # ships shared objects only; a static request there cannot be linked, and
        # the failure it used to produce read like a missing library.
        run: node --test scripts/ci/sherpa-onnx-link-mode.test.mjs
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            packages/rust_transcription -> packages/rust_transcription/target
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            clang \
            libclang-dev
      - name: Install system dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install -y llvm --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "CLANG_PATH=C:\Program Files\LLVM\bin\clang.exe" >> $env:GITHUB_ENV
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - name: Configure whisper build flags (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "CMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/packages/rust_transcription/cmake/linux-ci-toolchain.cmake" >> "$GITHUB_ENV"
      - name: Configure whisper build flags (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "CMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/packages/rust_transcription/cmake/macos-ci-toolchain.cmake" >> "$GITHUB_ENV"
      - name: Configure whisper build flags (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          echo "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\packages\rust_transcription\cmake\windows-ci-toolchain.cmake" >> $env:GITHUB_ENV
      - name: Run transcription unit tests
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/run-with-diagnostics.sh" transcription-unit cargo test --locked --manifest-path packages/rust_transcription/Cargo.toml --lib
      - name: Test the sherpa-onnx-sys build script
        shell: bash
        # Cargo builds a build script as a plain binary and runs it, so the tests in
        # patches/sherpa-onnx-sys-1.13.5/build.rs are compiled by none of the cargo
        # steps above, nor by cargo test --all-targets or cargo clippy
        # --all-targets anywhere in this repository: all three report
        # "0 passed; 0 failed" for a build script. This step is the only thing
        # that runs them, so without it the extracted-cache verification logic in
        # that file is unexercised while appearing tested.
        #
        # Placed after "Run transcription unit tests" deliberately. The harness asks
        # cargo to print the build script's rustc invocation with cargo build -vv on
        # a copy of the patch crate, and resolves build-dependencies offline from the
        # local cargo cache; the step above is what puts them there.
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/run-with-diagnostics.sh" sherpa-build-script-tests node scripts/ci/sherpa-build-script-tests.mjs
      # The selection rule and the rewrite this harness rests on, tested without cargo.
      # Before this step the four helpers those tests cover were exported "so
      # `sherpa-build-script-tests.test.mjs` can pin the selection rule" -- and no such
      # file existed, because the module ran the whole cargo replay on import, so the test
      # could not exist. That is the state `check-workspace-hygiene.test.mjs` exists to
      # catch, and it caught it the moment the file appeared: a guard in scripts/ci that
      # no workflow runs asserts nothing.
      #
      # Cheap and first, so a broken selection rule fails in seconds rather than after the
      # cargo work above. It needs no toolchain and no dependencies.
      - name: Test the sherpa build-script harness helpers
        shell: bash
        run: node --test scripts/ci/sherpa-build-script-tests.test.mjs
      - name: Run non-ignored integration tests
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/run-with-diagnostics.sh" sidecar cargo test --locked --manifest-path packages/rust_transcription/Cargo.toml --test sidecar_integration -- --nocapture --test-threads=1

      - name: Run ignored end-to-end integration tests
        run: cargo test --locked --manifest-path packages/rust_transcription/Cargo.toml --test sidecar_integration -- --ignored --nocapture --test-threads=1
