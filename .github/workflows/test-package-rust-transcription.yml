name: Test Package Rust Transcription

on:
  push:
    branches:
      - main
    paths:
      - "packages/rust_transcription/**"
      - ".github/workflows/test-package-rust-transcription.yml"
  pull_request:
    branches:
      - main
    paths:
      - "packages/rust_transcription/**"
      - ".github/workflows/test-package-rust-transcription.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test Rust Transcription (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu
            os: ubuntu-latest
          - label: Windows
            os: windows-latest
          - label: macOS
            os: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            packages/rust_transcription -> packages/rust_transcription/target
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            clang \
            libclang-dev
      - name: Install system dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install -y llvm --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "CLANG_PATH=C:\Program Files\LLVM\bin\clang.exe" >> $env:GITHUB_ENV
          "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - name: Configure whisper build flags (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "CMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/packages/rust_transcription/cmake/linux-ci-toolchain.cmake" >> "$GITHUB_ENV"
      - name: Configure whisper build flags (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "CMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/packages/rust_transcription/cmake/macos-ci-toolchain.cmake" >> "$GITHUB_ENV"
      - name: Configure whisper build flags (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          echo "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE\packages\rust_transcription\cmake\windows-ci-toolchain.cmake" >> $env:GITHUB_ENV
      - name: Run non-ignored integration tests
        run: cargo test --manifest-path packages/rust_transcription/Cargo.toml --test sidecar_integration -- --nocapture --test-threads=1

      - name: Run ignored end-to-end integration tests
        run: cargo test --manifest-path packages/rust_transcription/Cargo.toml --test sidecar_integration -- --ignored --nocapture --test-threads=1
