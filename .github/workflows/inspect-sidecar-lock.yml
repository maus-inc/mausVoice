name: Inspect Sidecar Lockfile

on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate lockfile (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-22.04
          - label: windows
            os: windows-latest
          - label: macos
            os: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Generate lockfile
        run: cargo generate-lockfile --manifest-path packages/rust_transcription/Cargo.toml
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v5
        with:
          name: sidecar-lock-${{ matrix.label }}
          path: packages/rust_transcription/Cargo.lock
          retention-days: 1
