name: Fallow

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Changed-code audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test audit gate
        run: node --test scripts/ci/fallow.test.mjs
      # The audit gates dead code, duplication and complexity in the changed
      # files. Import cycles are gated by `scripts/ci/fallow.test.mjs`, which
      # holds an explicit list of the cycles the base branch already had, so the
      # architecture pass is skipped here: it attributes a pre-existing cycle to
      # whichever member this pull request happened to edit and calls it new.
      - name: Audit pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm run fallow:audit --base "$BASE_SHA"
      - name: Audit manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: pnpm run fallow:audit --base "origin/$DEFAULT_BRANCH"
