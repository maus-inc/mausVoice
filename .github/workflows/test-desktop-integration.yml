name: Test Desktop Integration

on:
  push:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - ".github/workflows/test-desktop-integration.yml"
# These workflows run on branch pushes or manual requests, not PR events.
# Cancel superseded runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Desktop Integration Tests
    runs-on: ubuntu-latest
    # Provider-backed tests are push-only. Keep the origin guard as defense
    # in depth if a PR trigger is restored; fork code must not receive secrets.
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build dependencies
        run: pnpm exec turbo run build --filter=desktop^... --verbosity=2 --continue
      - name: Create empty .env file since secrets are injected via env vars
        run: |
          echo '' > apps/desktop/test/helpers/.env
      - name: Run integration tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pnpm --filter desktop run test:integration
