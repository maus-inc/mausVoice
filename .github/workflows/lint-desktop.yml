name: Lint Desktop
on:
  push:
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".nvmrc"
      - "patches/**"
      - "scripts/generate-app-icons.mjs"
      - ".github/workflows/lint-desktop.yml"

# Least privilege: linting only needs to read the checked-out source.
permissions:
  contents: read

# Run every stacked PR independently, but cancel superseded runs for the same
# PR (or the same branch for push/manual events) to avoid consuming runner slots.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-14
          - label: Windows
            os: windows-latest
          - label: Linux
            os: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            WEBKIT_PKG=libwebkit2gtk-4.1-dev
          else
            WEBKIT_PKG=libwebkit2gtk-4.0-dev
          fi
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libgtk-3-dev "$WEBKIT_PKG" \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev \
            libgtk-layer-shell-dev imagemagick
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build dependencies
        run: pnpm exec turbo run build --filter=desktop^... --verbosity=2 --continue
      - name: Lint TypeScript
        if: matrix.os == 'ubuntu-22.04'
        run: pnpm --filter desktop run lint
      - name: Lint Rust
        working-directory: apps/desktop/src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo clippy -- -D warnings
      - name: Lint native pill (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo clippy --manifest-path packages/rust_windows_pill/Cargo.toml --all-targets -- -D warnings
      - name: Lint native pill (macOS)
        if: matrix.os == 'macos-14'
        run: cargo clippy --manifest-path packages/rust_macos_pill/Cargo.toml --all-targets -- -D warnings
      - name: Lint native pill (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: cargo clippy --manifest-path packages/rust_gtk_pill/Cargo.toml --all-targets -- -D warnings
      - name: Test native pill
        if: matrix.os == 'windows-latest'
        run: cargo test --manifest-path packages/rust_windows_pill/Cargo.toml
      - name: Test shared pill geometry
        if: matrix.os == 'ubuntu-22.04'
        run: cargo test --manifest-path packages/rust_pill_shared/Cargo.toml
      - name: Verify app icons
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y imagemagick
          node scripts/generate-app-icons.mjs --check
