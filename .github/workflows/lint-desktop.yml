name: Lint Desktop
on:
  pull_request:
    branches:
      - main
      - linting
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - ".github/workflows/lint-desktop.yml"
jobs:
  lint:
    name: Lint Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-14
          - label: Windows
            os: windows-latest
          - label: Linux
            os: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            WEBKIT_PKG=libwebkit2gtk-4.1-dev
          else
            WEBKIT_PKG=libwebkit2gtk-4.0-dev
          fi
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libgtk-3-dev "$WEBKIT_PKG" \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev \
            libgtk-layer-shell-dev imagemagick
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build dependencies
        run: pnpm exec turbo run build --filter=desktop^...
      - name: Lint TypeScript
        if: matrix.os == 'ubuntu-22.04'
        run: pnpm --filter desktop run lint
      - name: Lint Rust
        working-directory: apps/desktop/src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo clippy -- -D warnings
      - name: Lint native pill (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo clippy --manifest-path packages/rust_windows_pill/Cargo.toml --all-targets -- -D warnings
      - name: Lint native pill (macOS)
        if: matrix.os == 'macos-14'
        run: cargo clippy --manifest-path packages/rust_macos_pill/Cargo.toml --all-targets -- -D warnings
      - name: Lint native pill (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: cargo clippy --manifest-path packages/rust_gtk_pill/Cargo.toml --all-targets -- -D warnings
      - name: Test native pill
        if: matrix.os == 'windows-latest'
        run: cargo test --manifest-path packages/rust_windows_pill/Cargo.toml
      - name: Test shared pill geometry
        if: matrix.os == 'ubuntu-22.04'
        run: cargo test --manifest-path packages/rust_pill_shared/Cargo.toml
      - name: Verify app icons
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y imagemagick
          node scripts/generate-app-icons.mjs --check
