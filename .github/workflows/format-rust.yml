name: Format Rust

# Detect `cargo fmt` drift in the Tauri crate and the native pill crates.
#
# Formatting is a pure text transformation, so its result is identical on
# every OS for a given rustfmt version. A single Linux job therefore
# covers all platforms, which also removes any risk of concurrent jobs
# racing to post the same PR comment.
#
# When drift is found the job:
#   1. Captures the `cargo fmt --check` report (which files drifted).
#   2. Formats in place, captures `git diff` (correct patch direction,
#      portable, clean a/ b/ paths), then restores the working tree so
#      nothing is committed by CI.
#   3. Resolves the open PR for the pushed branch via the pull-requests
#      API (push events do not carry a PR number).
#   4. Posts or updates ONE idempotent PR comment (marker-tagged,
#      paginated lookup) containing the report, the local command, and
#      the patch. The patch is a plain multi-file diff: GitHub's
#      "Commit suggestion" button only exists for single-file
#      ```suggestion blocks in review comments, so the comment says
#      exactly how to apply it (`git apply`) instead of promising a
#      one-click affordance that does not exist.
#   5. Exits non-zero so the check gates the PR until the fix lands.
on:
  push:
    paths:
      - "apps/desktop/src-tauri/**/*.rs"
      - "packages/rust_pill_shared/**/*.rs"
      - "packages/rust_windows_pill/**/*.rs"
      - "packages/rust_macos_pill/**/*.rs"
      - "packages/rust_gtk_pill/**/*.rs"
      - "packages/rust_transcription/**/*.rs"
      - ".github/workflows/format-rust.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  fmt:
    name: Cargo fmt check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          channel: stable
          components: rustfmt

      - name: Run cargo fmt --check and classify the result
        id: fmt
        shell: bash
        run: |
          : > /tmp/fmt-report.txt
          dirty=false
          error=false

          check_crate() {
            dir="$1"
            label="$2"
            {
              echo ""
              echo "=== $label ==="
            } >> /tmp/fmt-report.txt
            set +e
            (cd "$dir" && cargo fmt --check --all) >> /tmp/fmt-report.txt 2>&1
            rc=$?
            set -e
            # rustfmt exits 1 when it found drift; anything else is an
            # execution error (invalid Rust, missing manifest, bad flag).
            if [ "$rc" -eq 1 ]; then
              dirty=true
            elif [ "$rc" -ne 0 ]; then
              error=true
              echo "cargo fmt failed with exit code $rc in $label" >> /tmp/fmt-report.txt
            fi
          }

          check_crate "apps/desktop/src-tauri" "apps/desktop/src-tauri"
          for crate in rust_pill_shared rust_windows_pill rust_macos_pill rust_gtk_pill rust_transcription; do
            if [ -f "packages/$crate/Cargo.toml" ]; then
              check_crate "packages/$crate" "packages/$crate"
            fi
          done

          echo "dirty=$dirty" >> "$GITHUB_OUTPUT"
          echo "error=$error" >> "$GITHUB_OUTPUT"

      - name: Generate the formatting patch
        if: steps.fmt.outputs.dirty == 'true'
        shell: bash
        run: |
          # Format in place (the checkout is pristine on CI), capture the
          # git diff — correct old→new direction, portable, clean a/ b/
          # paths so `git apply` works — then restore the tree so CI
          # never leaves modifications behind.
          (cd apps/desktop/src-tauri && cargo fmt --all)
          for crate in rust_pill_shared rust_windows_pill rust_macos_pill rust_gtk_pill rust_transcription; do
            if [ -f "packages/$crate/Cargo.toml" ]; then
              (cd "packages/$crate" && cargo fmt --all)
            fi
          done
          # Cap at ~256 KB to stay under the PR comment body limit.
          git diff --no-color | head -c 262144 > /tmp/fmt-suggestion.diff
          git checkout -- .
          echo "patch_bytes=$(wc -c < /tmp/fmt-suggestion.diff)" >> "$GITHUB_OUTPUT"

      - name: Resolve the open PR for this branch
        if: steps.fmt.outputs.dirty == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Push events do not carry github.event.pull_request.number, so
          # look the PR up by branch name. Empty result means no open PR;
          # the comment step then skips and only the failing check gates.
          number=$(gh api \
            "repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:${GITHUB_REF_NAME}" \
            --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Resolved PR number: ${number:-<none>}"

      - name: Post or update the formatting comment
        if: steps.fmt.outputs.dirty == 'true' && steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          patch_bytes=$(wc -c < /tmp/fmt-suggestion.diff)
          {
            echo '<!-- maus-format-rust:marker -->'
            echo '## 🎨 Rust formatting needs attention'
            echo ''
            echo '`cargo fmt --check` reported drift on the latest push.'
            echo 'Fix it with either of these, then push:'
            echo ''
            echo '```bash'
            echo '# Option 1: format and commit locally'
            echo 'cd apps/desktop/src-tauri && cargo fmt --all'
            echo 'for crate in rust_pill_shared rust_windows_pill rust_macos_pill rust_gtk_pill rust_transcription; do'
            echo '  [ -f "packages/$crate/Cargo.toml" ] && (cd "packages/$crate" && cargo fmt --all)'
            echo 'done'
            echo ''
            echo '# Option 2: apply the patch below directly'
            echo 'git apply fmt.patch'
            echo '```'
            echo ''
            echo '<details>'
            echo "<summary>cargo fmt --check report</summary>"
            echo ''
            echo '```'
            cat /tmp/fmt-report.txt
            echo '```'
            echo '</details>'
            echo ''
            echo '<details>'
            echo "<summary>Suggested patch ($patch_bytes bytes)</summary>"
            echo ''
            echo 'The patch spans every dirty file. Save it and run `git apply fmt.patch`'
            echo 'from the repository root (GitHub'"'"'s "Commit suggestion" button only'
            echo 'works for single-file ```suggestion blocks, so it cannot be offered here).'
            echo ''
            echo '```diff'
            cat /tmp/fmt-suggestion.diff
            echo '```'
            echo '</details>'
          } > /tmp/fmt-comment.md

          # Idempotency: update the existing marker comment instead of
          # stacking duplicates. --paginate keeps the guarantee alive on
          # long-lived PRs with more than 100 comments.
          existing_id=$(gh api --paginate \
            "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | startswith("<!-- maus-format-rust:marker -->")) | .id' \
            | tail -n 1)
          if [ -n "$existing_id" ]; then
            gh api --method PATCH \
              "repos/${{ github.repository }}/issues/comments/$existing_id" \
              -f body=@/tmp/fmt-comment.md > /dev/null
            echo "Updated existing formatting comment $existing_id"
          else
            gh api --method POST \
              "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
              -f body=@/tmp/fmt-comment.md > /dev/null
            echo "Posted new formatting comment on PR #$PR_NUMBER"
          fi

      - name: Fail when the check is not clean
        if: steps.fmt.outputs.dirty == 'true' || steps.fmt.outputs.error == 'true'
        shell: bash
        run: |
          cat /tmp/fmt-report.txt
          if [ "${{ steps.fmt.outputs.error }}" = "true" ]; then
            echo "::error::cargo fmt failed to run (see report above)."
          else
            echo "::error::Rust formatting drift detected. See the PR comment for the patch."
          fi
          exit 1
