name: Test Desktop Unit

on:
  push:
    paths:
      - "scripts/ci/run-with-diagnostics.sh"
      - "scripts/ci/run-with-diagnostics.test.mjs"
      - "apps/desktop/**"
      - "apps/preview/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "packages/**"
      - "patches/**"
      - ".nvmrc"
      - "rust-toolchain.toml"
      - ".github/scripts/install-desktop-linux-deps.sh"
      - "scripts/check-bindings.sh"
      - "scripts/bindings.sh"
      - "scripts/ci/check-bindings-guard.test.mjs"
      - "scripts/ci/check-workflow-pins.test.mjs"
      - ".github/workflows/**"
# These workflows run on branch pushes or manual requests, not PR events.
# Cancel superseded runs for the same branch.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts-unit-tests:
    name: Desktop TS Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
      - name: Test CI diagnostics
        run: node --test scripts/ci/run-with-diagnostics.test.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build dependencies
        run: pnpm exec turbo run build --filter=desktop^... --verbosity=2 --continue
      - name: Run desktop unit tests
        run: pnpm --filter desktop run test:unit
      - name: Run preview unit tests
        run: pnpm --filter @maus-inc/preview test

  voice-ai-unit-tests:
    name: Voice-AI Package Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build dependencies
        run: pnpm exec turbo run build --filter=@maus-inc/voice-ai^... --verbosity=2 --continue
      - name: Run voice-ai unit tests
        run: pnpm --filter @maus-inc/voice-ai run test

  i18n-sync:
    name: Desktop i18n Catalog Sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Setup pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Sync i18n catalogs
        run: pnpm --filter desktop i18n
      - name: Verify catalogs are in sync
        run: |
          if ! git diff --exit-code -- apps/desktop/src/i18n/locales; then
            echo "::error::Locale catalogs are out of sync. Run 'pnpm --filter desktop i18n' and commit the result."
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard -- apps/desktop/src/i18n/locales)
          if [ -n "$untracked" ]; then
            echo "::error::Untracked locale files must be committed: $untracked"
            exit 1
          fi

  rust-unit-tests:
    name: Desktop Rust Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          # This job only runs node --test and cargo; it never installs pnpm,
          # and setup-node v5's package-manager-cache (default on) errors when
          # it cannot find the package manager binary.
          package-manager-cache: false
      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
      - name: Install system dependencies
        run: |
          sudo apt-get update
          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            WEBKIT_PKG=libwebkit2gtk-4.1-dev
          else
            WEBKIT_PKG=libwebkit2gtk-4.0-dev
          fi
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libgtk-3-dev "$WEBKIT_PKG" \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev
      - name: Check Rust formatting
        # Every crate, not just the one the tests below run: the deviations that
        # accumulated were in the pill crates and the transcription bench, and a
        # gate that only looked at src-tauri would have reported the repo clean.
        # `rust_windows_pill` is a crate of this repo too, and it is the one with
        # the most deviations of the six.
        working-directory: .
        shell: bash
        run: |
          for crate in \
            apps/desktop/src-tauri \
            packages/rust_pill_shared \
            packages/rust_gtk_pill \
            packages/rust_macos_pill \
            packages/rust_windows_pill \
            packages/rust_transcription; do
            echo "::group::$crate"
            (cd "$crate" && cargo fmt --check) || exit 1
            echo "::endgroup::"
          done
      - name: Run Rust unit tests
        working-directory: apps/desktop/src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/run-with-diagnostics.sh" rust-unit cargo test --locked --lib
      - name: Lint every Rust target
        # `--all-targets` rather than the library alone. A test or bench is not
        # linted by a `--lib` invocation, which is how six `assert!(true)` calls
        # in the drag tests and a redundant `trim` in consolidation.rs sat there
        # unnoticed: every one of them was checking a constant, which the
        # compiler folds away, so the test passed whatever the value was.
        working-directory: .
        shell: bash
        run: |
          # `rust_gtk_pill` is deliberately absent: it needs
          # `gtk-layer-shell-0`, which this job does not install and the Linux
          # desktop build does. Linting it here failed on a missing system
          # library rather than on anything in the code.
          for crate in apps/desktop/src-tauri packages/rust_pill_shared; do
            echo "::group::$crate"
            (cd "$crate" && TAURI_CONFIG='{"bundle":{"externalBin":[]}}' \
              cargo clippy --locked --all-targets -- -D warnings) || exit 1
            echo "::endgroup::"
          done
      - name: Check published package export contracts
        run: node --test scripts/ci/package-exports.test.mjs
      - name: Test check-bindings tracked-file guard
        run: node --test scripts/ci/check-bindings-guard.test.mjs
      - name: Test workflow action pin guard
        run: node --test scripts/ci/check-workflow-pins.test.mjs
      - name: Verify generated bindings are in sync
        # Regenerates packages/desktop-native-apis/src/bindings.ts from the
        # generator example and fails on any diff. Guards against a command
        # added to app.rs/commands.rs without a matching bindings.ts entry
        # (or vice versa), which previously shipped silently.
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/run-with-diagnostics.sh" bindings bash scripts/check-bindings.sh

  # The `cfg(windows)` half of the desktop crate is compiled by the Windows app
  # build, but nothing linted it outside the binary, and nothing could test it:
  # `console_display_is_on` was unreachable from the Ubuntu job for exactly that
  # reason, and the missing import that broke the Windows build sat in code no
  # Linux command could see. This job closes that.
  #
  # The standalone macOS pill crate needed nothing: `lint-desktop.yml` already
  # lints and tests it on `macos-14`. Its gap was formatting, and that is
  # covered here -- `cargo fmt --check` does not need the target.
  rust-windows-gated:
    name: Rust (Windows-gated code)
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
      - name: Lint the Windows-gated code
        # Lint, not test: the desktop crate links WebView2, and a bare
        # windows-2022 runner has no WebView2 runtime, so the test binary exits
        # with STATUS_ENTRYPOINT_NOT_FOUND before a single test runs. Clippy
        # with `--all-targets` still compiles the `cfg(windows)` code *and* its
        # `cfg(test)` modules, which is the coverage that matters here -- it is
        # what found the dead binding that only `#[cfg(unix)]` reads.
        working-directory: apps/desktop/src-tauri
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check Windows-gated formatting
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: cargo fmt --check
