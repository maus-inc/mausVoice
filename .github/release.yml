# Release-note categories for mausVoice. GitHub groups auto-generated notes
# under these headings when a release's notes are generated by GitHub (the
# Releases UI or `generate_release_notes`). The pipeline itself does NOT read
# this file: release.yml builds its body with
# scripts/ci/generate-release-body.mjs and passes it as `body_path`.
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot[bot]
  categories:
    - title: Breaking changes
      labels:
        - breaking
        - breaking-change
    - title: New features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - fix
        - bug
    - title: Performance
      labels:
        - performance
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Maintenance
      labels:
        - chore
        - refactor
        - ci
        - dependencies
    - title: Other changes
      labels:
        - "*"
