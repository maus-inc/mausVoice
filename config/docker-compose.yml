services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11431:11434"
    networks:
      - mausvoice-net

  caddy:
    image: caddy:2.8
    container_name: ollama-gateway
    restart: unless-stopped
    environment:
      API_KEY: test-api-key-12345
    ports:
      - "11430:11434"
    volumes:
      - ./ollama/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - mausvoice-net
    depends_on:
      - ollama

volumes:
  ollama_data:

networks:
  mausvoice-net:
