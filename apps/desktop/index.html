<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mausVoice</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      /*
        Pre-hydration canvas. Must stay in sync with `surfaces.*.level0` in
        src/styles/palette.ts - React has not mounted yet, so the theme cannot
        paint this and a mismatch shows as a colour flash on launch.

        The inline script below overrides these with the persisted MUI mode
        (localStorage "mode") before React mounts; the media query remains the
        no-JS / no-preference fallback.
      */
      body {
        margin: 0;
        background-color: #0c0c0d;
      }

      @media (prefers-color-scheme: light) {
        body {
          background-color: #f5f2ed;
        }
      }

      /*
        Pre-hydration boot classes. The inline script below adds one of these
        to <body> instead of setting an inline background-color: an inline
        style outranks the MUI CssBaseline body rule forever, which hardcoded
        the canvas to the launch-time scheme and made runtime light-mode
        switches appear broken. These classes are removed on mount (see
        src/main.tsx) so the runtime theme owns the background from then on.
      */
      body.boot-theme-dark {
        background-color: #0c0c0d !important;
      }

      body.boot-theme-light {
        background-color: #f5f2ed !important;
      }

      .firebase-emulator-warning {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Pre-hydration theme bootstrap: read the persisted MUI mode
      // (localStorage "mode" — ThemeProvider's colorSchemeStorageKey), resolve
      // "system" via matchMedia, and paint the matching surfaces.level0
      // background via a boot class so the launch canvas never flashes the
      // wrong scheme. The class is removed on mount (src/main.tsx).
      (function () {
        var stored;
        try {
          stored = localStorage.getItem("mode");
          if (stored === null) {
            // One-time migration: MUI previously persisted the scheme under
            // its own default key; the app now uses "mode" explicitly
            // (ThemeProvider colorSchemeStorageKey). Carry the old choice
            // over so users don't lose their theme on first launch.
            var legacy = localStorage.getItem("mui-mode");
            if (
              legacy === "light" ||
              legacy === "dark" ||
              legacy === "system"
            ) {
              stored = legacy;
              localStorage.setItem("mode", legacy);
            }
          }
        } catch {
          // Storage can be unavailable (private mode, disabled cookies);
          // fall back to the system preference.
          stored = null;
        }
        var mode =
          stored === "light" || stored === "dark" || stored === "system"
            ? stored
            : "system";
        var resolved = mode;
        if (mode === "system") {
          var prefersLight = window.matchMedia
            ? window.matchMedia("(prefers-color-scheme: light)").matches
            : false;
          resolved = prefersLight ? "light" : "dark";
        }
        document.body.classList.add(
          resolved === "light" ? "boot-theme-light" : "boot-theme-dark",
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
