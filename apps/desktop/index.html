<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mausVoice</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      /*
        Pre-hydration canvas. The script below resolves the persisted mode and
        sets the same selector MUI uses before <body> is painted. The fallback
        colours must stay in sync with surfaces.*.level0 in src/styles/palette.ts.
        Once MUI mounts, --app-palette-level0 supplies the runtime value.
      */
      body {
        margin: 0;
        background-color: var(--app-palette-level0, #0c0c0d);
      }

      @media (prefers-color-scheme: light) {
        body {
          background-color: var(--app-palette-level0, #f5f2ed);
        }
      }

      html[data-mui-color-scheme="dark"] body {
        background-color: var(--app-palette-level0, #0c0c0d);
      }

      html[data-mui-color-scheme="light"] body {
        background-color: var(--app-palette-level0, #f5f2ed);
      }

      .firebase-emulator-warning {
        display: none !important;
      }
    </style>
    <script>
      // Keep this key and selector aligned with THEME_MODE_STORAGE_KEY and
      // THEME_COLOR_SCHEME_SELECTOR in src/theme.ts.
      (function () {
        var stored;
        try {
          // Keep MUI's established mode key as the source of truth. The first
          // light-mode fix read "mode" during bootstrap but set
          // colorSchemeStorageKey instead of modeStorageKey, so some installs
          // can have only that fallback copy. Migrate it without deleting it,
          // preserving compatibility with both upgrades and rollbacks.
          stored = localStorage.getItem("mui-mode");
          if (stored !== "light" && stored !== "dark" && stored !== "system") {
            var legacy = localStorage.getItem("mode");
            if (
              legacy === "light" ||
              legacy === "dark" ||
              legacy === "system"
            ) {
              // Assign before persisting so a failed write keeps the valid
              // legacy preference instead of falling back to "system".
              stored = legacy;
              try {
                localStorage.setItem("mui-mode", legacy);
              } catch {
                // Best-effort migration; a persistence failure is non-fatal.
              }
            }
          }
        } catch {
          stored = null;
        }

        var mode =
          stored === "light" || stored === "dark" || stored === "system"
            ? stored
            : "system";
        var resolved = mode;
        if (mode === "system") {
          var prefersDark = window.matchMedia
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
            : true;
          resolved = prefersDark ? "dark" : "light";
        }

        document.documentElement.dataset.muiColorScheme = resolved;
      })();
    </script>
    <script data-early-error>
      // Early resource-error safety net. Runs before any generated
      // <link>/<script> tags, so a failed asset load under Tauri's asset:
      // protocol paints this overlay instead of a blank window. The full
      // handler in src/utils/global-error-overlay.utils.ts takes over once the
      // bundle loads. Scoped to resource errors only; runtime errors after
      // mount are handled by that module.
      (function () {
        var OVERLAY_ID = "maus-global-error-overlay";
        function paint(heading, detail) {
          var el = document.getElementById(OVERLAY_ID);
          if (!el) {
            el = document.createElement("div");
            el.id = OVERLAY_ID;
            el.style.cssText = [
              "position:fixed",
              "inset:0",
              "z-index:2147483647",
              "box-sizing:border-box",
              "background:#0c0c0d",
              "color:#f5f2ed",
              "font:14px/1.6 system-ui,-apple-system,sans-serif",
              "padding:32px",
              "overflow:auto",
              "white-space:pre-wrap",
            ].join(";");
            (document.body || document.documentElement).appendChild(el);
          }
          el.textContent = heading + "\n\n" + detail;
        }
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (
              target instanceof HTMLScriptElement ||
              target instanceof HTMLLinkElement
            ) {
              var url =
                target instanceof HTMLScriptElement ? target.src : target.href;
              paint(
                "mausVoice failed to start",
                "Failed to load resource: " +
                  (url || "(unknown URL)") +
                  "\n\nThe frontend asset could not be fetched. Under Tauri's asset: protocol this is usually a CORS or path issue — check the built index.html asset URLs.",
              );
            }
          },
          true,
        );
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
