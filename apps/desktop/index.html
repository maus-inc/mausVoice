<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mausVoice</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      /*
        Pre-hydration canvas. The script below resolves the persisted mode and
        sets the same selector MUI uses before <body> is painted. The fallback
        colours must stay in sync with surfaces.*.level0 in src/styles/palette.ts.
        Once MUI mounts, --app-palette-level0 supplies the runtime value.
      */
      body {
        margin: 0;
        background-color: var(--app-palette-level0, #0c0c0d);
      }

      @media (prefers-color-scheme: light) {
        body {
          background-color: var(--app-palette-level0, #f5f2ed);
        }
      }

      html[data-mui-color-scheme="dark"] body {
        background-color: var(--app-palette-level0, #0c0c0d);
      }

      html[data-mui-color-scheme="light"] body {
        background-color: var(--app-palette-level0, #f5f2ed);
      }

      .firebase-emulator-warning {
        display: none !important;
      }
    </style>
    <script>
      // Keep this key and selector aligned with THEME_MODE_STORAGE_KEY and
      // THEME_COLOR_SCHEME_SELECTOR in src/theme.ts.
      (function () {
        var stored;
        try {
          stored = localStorage.getItem("mode");

          // MUI's setMode persists to modeStorageKey, whose old default was
          // "mui-mode". The first light-mode fix configured
          // colorSchemeStorageKey instead, which only controls per-mode scheme
          // IDs, so setMode still wrote the latest choice to "mui-mode".
          // Migrate that authoritative value once, then remove the legacy key.
          var legacy = localStorage.getItem("mui-mode");
          if (legacy === "light" || legacy === "dark" || legacy === "system") {
            stored = legacy;
            localStorage.setItem("mode", legacy);
            localStorage.removeItem("mui-mode");
          }
        } catch {
          stored = null;
        }

        var mode =
          stored === "light" || stored === "dark" || stored === "system"
            ? stored
            : "system";
        var resolved = mode;
        if (mode === "system") {
          var prefersDark = window.matchMedia
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
            : true;
          resolved = prefersDark ? "dark" : "light";
        }

        document.documentElement.dataset.muiColorScheme = resolved;
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
