[allowlist]
description = "Public/non-secret values"
paths = [
  # Firebase client config (public by design, protected by security rules)
  '''apps/desktop/\.env\.(dev|emulators|prod)''',
  '''apps/desktop/src/main\.tsx''',

  # Test files with mock/dummy API keys
  '''apps/desktop/test/.*\.test\.ts''',
  '''enterprise/gateway/test/.*\.test\.ts''',

  # Docker compose config values (local dev, not real secrets)
  '''config/docker-compose\.yml''',
  '''enterprise/docker-compose\.yml''',

  # Documentation examples
  '''docs/.*\.md''',
]
regexes = [
  '''pk_live_.*''',
]

# Only the rules below are enforced. We intentionally do NOT inherit Gitleaks'
# default rule set here so that this focused scan cannot fail CI on unrelated
# historical/third-party patterns; the threat model we must guarantee is a
# committed Tauri/Minisign updater private signing key.
useDefault = false
[[rules]]
id = "tauri-minisign-updater-private-key"
description = "Tauri/Minisign updater private signing key ('untrusted comment: rsign'). A committed updater signing key lets a fork forge trusted auto-updates, so it must never be committed."
regex = '''dW50cnVzdGVkIGNvbW1lbnQ6IHJzaWdu'''
keywords = ["untrusted comment: rsign", "rsign"]
