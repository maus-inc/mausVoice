# Detect a committed Tauri/Minisign (rsign) updater private key.
# The secret-key base64 preamble decodes to "untrusted comment: rsign
# encrypted secret key" (dW50cnVzdGVkIGNvbW1lbnQ6IHJzaWdu...).
[[rules]]
id = "tauri-minisign-updater-private-key"
description = "Tauri/Minisign (rsign) updater private key"
regex = '''(?i)dW50cnVzdGVkIGNvbW1lbnQ6IHJzaWdu'''
keywords = ["dW50cnVzdGVkIGNvbW1lbnQ6IHJzaWdu"]

[allowlist]
description = "Public/non-secret values"
paths = [
  # Firebase client config (public by design, protected by security rules)
  '''apps/desktop/\.env\.(dev|emulators|prod)''',
  '''apps/desktop/src/main\.tsx''',

  # Test files with mock/dummy API keys
  '''apps/desktop/test/.*\.test\.ts''',
  '''enterprise/gateway/test/.*\.test\.ts''',

  # Docker compose config values (local dev, not real secrets)
  '''config/docker-compose\.yml''',
  '''enterprise/docker-compose\.yml''',

  # Documentation examples
  '''docs/.*\.md''',
]
regexes = [
  '''pk_live_.*''',
  # Tauri/Minisign PUBLIC key (base64 "untrusted comment: minisign public key").
  # Intentionally committed (updater pubkey + CI validation); not a secret.
  # NOTE: the public-key preamble (minisign) is distinct from the private-key
  # preamble (rsign) caught by the rule above, so this does not suppress it.
  '''dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaW4''',
]
