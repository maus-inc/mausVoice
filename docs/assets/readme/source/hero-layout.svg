<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">mausVoice README hero</title>
  <desc id="desc">mausVoice wordmark and value statement beside the real recording pill and app icon.</desc>

  <!-- background board -->
  <rect width="1200" height="380" rx="26" fill="#0a0a0a"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="25.5" fill="none" stroke="#262626"/>

  <!-- left column: identity and promise -->
  <g id="title-block">
    <text x="56" y="102"
          font-family="'JetBrains Mono','DejaVu Sans Mono',monospace"
          font-size="19" letter-spacing="1.5" fill="#8f8f8f">Free + open source · macOS / Windows / Linux</text>

    <text x="56" y="212"
          font-family="'TAN - PARADISO','TANPARADISO',Georgia,serif"
          font-size="78" letter-spacing="1" fill="#ffffff">mausVoice</text>

    <text x="56" y="268"
          font-family="Satoshi,'DejaVu Sans',sans-serif" font-weight="500"
          font-size="23" fill="#d6d6d6">Press a hotkey, speak, and the cleaned-up</text>
    <text x="56" y="300"
          font-family="Satoshi,'DejaVu Sans',sans-serif" font-weight="500"
          font-size="23" fill="#d6d6d6">text lands in whatever app has focus.</text>

    <text x="56" y="342"
          font-family="'JetBrains Mono','DejaVu Sans Mono',monospace"
          font-size="16" letter-spacing="1" fill="#6b6b6b">Rust core · Encrypted local keys · AGPL-3.0</text>
  </g>

  <!-- hairline divider -->
  <line x1="688" y1="64" x2="688" y2="316" stroke="#242424" stroke-width="1"/>

  <!-- right column: real product material -->
  <g id="project-proof">
    <!-- app icon tile (../../graphic.png == docs/assets/graphic.png) -->
    <image id="icon" href="../../graphic.png" x="1014" y="56" width="118" height="118"/>
    <!-- recording pill still, frame 6 of docs/assets/animated-pill.gif -->
    <image id="pill" href="pill-still.png" x="716" y="204" width="420" height="113.6"/>
    <!-- cursor arrow, echoing the banner motif -->
    <g transform="translate(1128 306) scale(1.25)">
      <path d="M0 0 L0 25 L6.5 19.4 L10.8 30.4 L14.3 28.6 L10 17.8 L17.5 17.8 Z"
            fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
    </g>
  </g>
</svg>
