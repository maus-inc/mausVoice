packages:
  - "apps/*"
  # Rust crates and shared-font assets under packages/ are not JS workspaces.
  # check-workspace-hygiene.test.mjs keeps this list in sync with package.json files.
  - "packages/agent"
  - "packages/desktop-native-apis"
  - "packages/desktop-utils"
  - "packages/eslint-config"
  - "packages/firemix"
  - "packages/types"
  - "packages/typescript-config"
  - "packages/utilities"
  - "packages/voice-ai"

onlyBuiltDependencies:
  - "esbuild"
  - "sharp"
  - "bcrypt"
  - "protobufjs"
  - "chromedriver"
  - "@firebase/util"
  - "re2"

peerDependencyRules:
  allowedVersions:
    vite: ">=6.4.3 <9.0.0"
    zod: ">=3.23.8 <5.0.0"
