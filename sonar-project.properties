# SonarQube Cloud — Automatic Analysis
# This project uses Automatic Analysis (autoscan): SonarCloud reads the repo
# directly from GitHub; no CI scan step or token is required.
#
# Deliberately minimal. Sources are the real product code; we exclude generated
# artifacts, lockfiles, vendored dependency patches, tests, and reference copies.

sonar.projectKey=maus-inc_voquill
sonar.organization=maus-inc

sonar.sources=apps,packages
sonar.inclusions=**/*.ts,**/*.tsx,**/*.rs,**/*.js,**/*.mjs,**/*.cjs
sonar.exclusions=patches/**/*,**/dist/**/*,**/build/**/*,**/target/**/*,**/node_modules/**/*,**/*.test.*,**/*.spec.*,**/test/**/*,**/__tests__/**/*,**/db/migrations/**/*,reports/**/*,**/reports/**/*,**/fixtures/**/*

sonar.sourceEncoding=UTF-8
sonar.cpd.exclusions=apps/preview/**/*,**/*.test.*,**/*.spec.*,**/test/**/*,**/__tests__/**/*,**/fixtures/**/*
